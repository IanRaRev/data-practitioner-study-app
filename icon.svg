<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background rounded rectangle for iOS icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#334155" stroke-width="4"/>
  
  <!-- Central Glow -->
  <circle cx="256" cy="240" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Database Stack / Cloud Data Practitioner Icon -->
  <!-- Layer 3 (Bottom) -->
  <g transform="translate(136, 290)">
    <path d="M0,25 C0,45 54,60 120,60 C186,60 240,45 240,25 L240,65 C240,85 186,100 120,100 C54,100 0,85 0,65 Z" fill="#34A853" opacity="0.9"/>
    <ellipse cx="120" cy="25" rx="120" ry="30" fill="#4ade80"/>
  </g>

  <!-- Layer 2 (Middle) -->
  <g transform="translate(136, 215)">
    <path d="M0,25 C0,45 54,60 120,60 C186,60 240,45 240,25 L240,65 C240,85 186,100 120,100 C54,100 0,85 0,65 Z" fill="#FBBC05" opacity="0.9"/>
    <ellipse cx="120" cy="25" rx="120" ry="30" fill="#fde047"/>
  </g>

  <!-- Layer 1 (Top) -->
  <g transform="translate(136, 140)">
    <path d="M0,25 C0,45 54,60 120,60 C186,60 240,45 240,25 L240,65 C240,85 186,100 120,100 C54,100 0,85 0,65 Z" fill="#4285F4" opacity="0.95"/>
    <ellipse cx="120" cy="25" rx="120" ry="30" fill="#60a5fa"/>
  </g>

  <!-- Google Cloud 4-color accent arcs -->
  <circle cx="256" cy="110" r="28" fill="#EA4335" filter="url(#glow)"/>
  <path d="M256,96 L256,124 M242,110 L270,110" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Badge banner -->
  <rect x="86" y="405" width="340" height="48" rx="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="256" y="437" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#f8fafc" letter-spacing="2">GCP DATA PRACTITIONER</text>
</svg>
